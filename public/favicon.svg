<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="45%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Red Comb Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- White Feather Gradient -->
    <linearGradient id="featherGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Emerald Leaf / Tail Gradient -->
    <linearGradient id="emeraldTail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#022c22" flood-opacity="0.45"/>
    </filter>

    <filter id="birdShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#011e15" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Icon Squircle (Modern Web & Mobile App Standards) -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" filter="url(#badgeShadow)"/>
  
  <!-- Subtle Inner Ring Accent -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="#34d399" stroke-width="3" stroke-opacity="0.35" stroke-dasharray="14 10"/>

  <!-- Golden Agricultural Arc / Cradle at base -->
  <path d="M 110 395 C 190 445 322 445 402 395 C 330 428 182 428 110 395 Z" fill="url(#goldGrad)" opacity="0.95" />

  <!-- The Bird (Hen/Rooster Emblem) with subtle shadow -->
  <g filter="url(#birdShadow)">
    
    <!-- Flowing Tail Feathers (Left Side) -->
    <path d="M 185 270 C 130 225 90 260 78 315 C 72 342 94 352 116 338 C 148 310 170 300 185 270 Z" fill="url(#emeraldTail)"/>
    <path d="M 175 288 C 122 265 96 312 112 350 C 122 360 138 355 150 338 C 166 316 175 302 175 288 Z" fill="url(#goldGrad)"/>
    <path d="M 180 312 C 138 318 122 360 144 376 C 160 370 176 348 190 326 Z" fill="#6ee7b7" opacity="0.95"/>

    <!-- Red Crest / Comb (Top of Head) -->
    <path d="M 230 148 C 218 98 252 72 280 94 C 302 72 340 78 352 112 C 374 96 402 112 396 146 C 390 168 362 174 340 174 C 296 174 252 168 230 148 Z" fill="url(#redGrad)"/>

    <!-- Red Wattle (Under Beak) -->
    <path d="M 374 235 C 396 246 402 292 380 304 C 356 316 344 288 356 252 Z" fill="url(#redGrad)"/>

    <!-- Bird Main Body & Graceful Neck (White/Silver Feather Gradient) -->
    <path d="M 218 178 C 240 150 302 138 346 150 C 374 156 392 184 386 218 C 370 240 354 246 342 268 C 326 302 338 335 376 368 C 344 396 278 402 232 390 C 176 374 152 318 168 262 C 180 222 202 195 218 178 Z" fill="url(#featherGrad)"/>

    <!-- Sharp Beak (Golden Amber) -->
    <path d="M 380 190 L 442 212 L 374 234 Z" fill="url(#goldGrad)"/>

    <!-- Eye (Deep Forest with Bright White Glint) -->
    <circle cx="334" cy="190" r="14" fill="#022c22"/>
    <circle cx="338" cy="186" r="4.5" fill="#ffffff"/>

    <!-- Wing Plume (Sculpted Golden Wing Feather Accent) -->
    <path d="M 190 268 C 234 256 296 284 314 328 C 286 356 230 356 196 328 C 180 312 182 284 190 268 Z" fill="url(#goldGrad)"/>
    <path d="M 206 284 C 238 278 278 298 290 332 C 268 348 230 346 212 328 Z" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- Golden 5-point Star (KP Emblem style) -->
  <g transform="translate(418, 92) scale(1.3)" filter="url(#birdShadow)">
    <polygon points="0,-18 5,-5 18,-5 8,4 12,17 0,9 -12,17 -8,4 -18,-5 -5,-5" fill="url(#goldGrad)"/>
  </g>
</svg>